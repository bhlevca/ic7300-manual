<svg xmlns='http://www.w3.org/2000/svg' width='880' height='220' role='img' aria-label='Tuner auto-sequence annotated'>
  <rect width='100%' height='100%' fill='#ffffff'/>
  <text x='28' y='26' font-size='16' fill='#222'>Tuner Auto‑Sequence — annotated</text>
  <g transform='translate(28,48)'>
    <g>
      <rect x='0' y='0' width='200' height='120' rx='8' fill='#e3f2fd' stroke='#42a5f5'/>
      <text x='100' y='70' font-size='13' text-anchor='middle' fill='#1565c0'>1. Long‑press TUNER (start)</text>
    </g>
    <g>
      <rect x='230' y='0' width='200' height='120' rx='8' fill='#fff3e0' stroke='#ffb74d'/>
      <text x='330' y='70' font-size='13' text-anchor='middle' fill='#ef6c00'>2. Tuning (blinking)</text>
    </g>
    <g>
      <rect x='460' y='0' width='200' height='120' rx='8' fill='#e8f5e9' stroke='#66bb6a'/>
      <text x='560' y='70' font-size='13' text-anchor='middle' fill='#2e7d32'>3. Match found (TUNE steady)</text>
    </g>
    <g>
      <rect x='690' y='0' width='160' height='120' rx='8' fill='#f3e5f5' stroke='#ab47bc'/>
      <text x='770' y='70' font-size='13' text-anchor='middle' fill='#6a1b9a'>4. Confirm SWR and save</text>
    </g>
    <line x1='200' y1='60' x2='230' y2='60' stroke='#888' stroke-width='2' marker-end='url(#a)'/>
    <line x1='430' y1='60' x2='460' y2='60' stroke='#888' stroke-width='2' marker-end='url(#a)'/>
    <line x1='660' y1='60' x2='690' y2='60' stroke='#888' stroke-width='2' marker-end='url(#a)'/>
    <defs>
      <marker id='a' markerWidth='6' markerHeight='6' refX='5' refY='3' orient='auto'><path d='M0,0 L6,3 L0,6 z' fill='#666'/></marker>
    </defs>
  </g>
  <text x='28' y='205' font-size='11' fill='#666'>Caption: Tuner auto‑sequence with clear step labels; recommended to replace with annotated screenshot/GIF from the unit.</text>
</svg>