<svg xmlns='http://www.w3.org/2000/svg' width='700' height='180' role='img' aria-label='SWR tuning annotated example'>
  <rect width='100%' height='100%' fill='#ffffff'/>
  <text x='20' y='24' font-size='16' fill='#222'>SWR Tuning — annotated example</text>
  <g transform='translate(20,40)'>
    <rect x='0' y='0' width='660' height='100' fill='#f1f8e9' stroke='#c5e1a5' rx='6'/>
    <text x='18' y='28' font-size='12' fill='#2e7d32'>1) Set RF power low (5–10 W)</text>
    <text x='18' y='48' font-size='12' fill='#2e7d32'>2) Bypass tuner, set carrier or use TUNE</text>
    <text x='18' y='68' font-size='12' fill='#2e7d32'>3) Select meter → SWR, key briefly, read value</text>
    <line x1='420' y1='20' x2='620' y2='20' stroke='#66bb6a' stroke-width='2' stroke-dasharray='4 3'/>
    <text x='430' y='16' font-size='10' fill='#444'>Acceptable range &lt; 1.5:1</text>
  </g>
  <text x='20' y='158' font-size='11' fill='#666'>Caption: Annotated steps for safe SWR measurement and tuning; replace with a real annotated screenshot if available.</text>
</svg>