<svg xmlns='http://www.w3.org/2000/svg' width='720' height='160' role='img' aria-label='Scan flow annotated'>
  <rect width='100%' height='100%' fill='#ffffff'/>
  <text x='20' y='22' font-size='16' fill='#222'>Scan Flow — annotated</text>
  <g font-family='sans-serif' font-size='12' fill='#37474f'>
    <rect x='20' y='36' width='160' height='64' rx='6' fill='#e3f2fd' stroke='#90caf9'/>
    <text x='30' y='60'>Prepare program or memory list</text>
    <rect x='210' y='36' width='160' height='64' rx='6' fill='#fff3e0' stroke='#ffcc80'/>
    <text x='220' y='60'>Start scan (Program/Memory)</text>
    <rect x='400' y='36' width='240' height='64' rx='6' fill='#e8f5e9' stroke='#a5d6a7'/>
    <text x='410' y='60'>Radio steps and stops on signal → tune</text>
    <line x1='180' y1='68' x2='210' y2='68' stroke='#9e9e9e' stroke-width='2' marker-end='url(#arrow)'/>
    <line x1='370' y1='68' x2='400' y2='68' stroke='#9e9e9e' stroke-width='2' marker-end='url(#arrow)'/>
    <defs>
      <marker id='arrow' markerWidth='6' markerHeight='6' refX='5' refY='3' orient='auto'><path d='M0,0 L6,3 L0,6 z' fill='#616161'/></marker>
    </defs>
  </g>
  <text x='20' y='140' font-size='11' fill='#666'>Caption: Program/Memory/Scope scan flow; replace with annotated GIF showing scope touch‑to‑tune sequence.</text>
</svg>